<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Perfil - Controle de Travete</title>

    <link rel="stylesheet" href="./src/css/global.css">
    <link rel="stylesheet" href="./src/css/index.css">
    <link rel="stylesheet" href="./src/css/perfil.css">
    
    
</head>

<body>

    <div class="perfil-page">

        <div class="perfil-header">

            <button id="btnVoltarPerfil" type="button">
                ←
            </button>

            <h1>
                Editar Perfil
            </h1>

        </div>

        <div class="perfil-card">

            <label for="campoFoto" id="perfilFoto" class="perfil-foto">
                👤
                <input type="file" id="campoFoto" accept="image/*" hidden>
            </label>

            <h2 id="perfilNome">
                Usuário
            </h2>

            <p id="perfilStatus">
                Conta local
            </p>

            <label for="campoNome">
                Nome
            </label>

            <input type="text" id="campoNome" placeholder="Digite seu nome" maxlength="50">

            <button id="btnSalvarNome" type="button">
                Salvar nome
            </button>

        </div>

    </div>

    


    <section class="perfil-acao-conta" aria-label="Conta">
        <button
            type="button"
            id="btnSairConta"
            class="perfil-botao-sair"
        >
            Sair da conta
        </button>
        <p id="mensagemSairConta" role="status" aria-live="polite"></p>
    </section>

<script type="module" src="./src/js/auth-entry.js" data-auth-entry data-modules="GlobalAparenciaController.js,perfil.js"></script>
</body>

</html>
