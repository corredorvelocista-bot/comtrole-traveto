<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7fb">
  <title>Entrar | Anotei</title>
  <link rel="stylesheet" href="/src/css/login.css">
  <script type="module" src="/src/js/login.js"></script>
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="brand-mark" aria-hidden="true">A</div>
      <p class="eyebrow">ORGANIZAÇÃO E CONTROLE</p>
      <h1>Bem-vindo ao Anotei</h1>
      <p class="subtitle">Entre na sua conta para continuar acompanhando sua produção.</p>

      <button id="google-login" class="google-button" type="button">
        <span class="google-icon" aria-hidden="true">G</span>
        <span id="google-label">Continuar com Google</span>
      </button>

      <p id="login-message" class="message" role="status" aria-live="polite"></p>

      <p class="privacy-note">
        Sua conta será usada para identificar seu acesso ao Anotei.
      </p>
    </section>
    <footer>ANOTEI · SUA ROTINA MAIS ORGANIZADA</footer>
  </main>
</body>
</html>
